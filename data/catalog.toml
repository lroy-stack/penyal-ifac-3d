# Source catalogue for penyal-ifac-3d. Validated by penyal_pipeline.catalog.
#
# Common fields: id, phase, kind (file | wfs | osm | wms), description, used_for, licence, attribution.
# Optional: optional (default false), share_alike (default false).
# kind = "file": url, expected_bytes, size_tolerance (default 0.01; a fraction of expected_bytes).
#   filename (optional) overrides the name derived from the last URL path segment.
#   Sizes below come from HTTP Content-Length observed on 2026-10-10 and are rounded, hence the
#   wider tolerance. Replace expected_bytes with the exact size after the first download.
# kind = "wfs": endpoint, version, bbox (minx, miny, maxx, maxy), crs, output_format, page_size,
#   sort_by (optional WFS sortBy; changing it reorders features and so changes the locked files),
#   and one [[source.layers]] table per feature type (confirmed = false: failures are skipped).
# kind = "wms": endpoint, version (1.3.0), layer, crs, bbox (minx, miny, maxx, maxy in that CRS),
#   width, height (px), output_format (image/jpeg | image/png), expected_bytes, size_tolerance
#   (default 0.01; a server re-encode can change the bytes, so crops use a wider one). One
#   deterministic GetMap, saved as <id>.<ext>; the lock records the request parameters.
# kind = "osm": url (OSM API map call; bbox order is min_lon,min_lat,max_lon,max_lat).

