# CI for Penyal d'Ifac 3D: the same gates as the studio Stop hook, plus the E2E specs that do not
# need the generated terrain (data/raw is not in git; data-dependent tests skip on a clean clone).
# Actions are pinned to commit SHAs (tag in the comment), all released at least two weeks before
# 2026-10-11.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project pipeline --locked
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @penyal/app exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter @penyal/app exec playwright test e2e/walk-test.spec.ts e2e/terrain-streaming.spec.ts --workers=1
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: app/test-results
          retention-days: 7
