<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{pageTitle}}</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1a2a;
      }
      #scene {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      #fatal {
        position: fixed;
        inset: 0;
        z-index: 9;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: #0b1a2a;
        color: #fff;
        font: 1.125rem/1.5 system-ui, sans-serif;
        text-align: center;
      }
      #fatal[data-visible="true"] {
        display: flex;
      }
      #poster {
        position: fixed;
        inset: 0;
        z-index: 4;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        background: linear-gradient(#0b1a2a, #16384f);
        color: #fff;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      #poster[hidden] {
        display: none;
      }
      #poster h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3.5rem);
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      #poster-message {
        margin: 0;
        font-size: 1.125rem;
      }
      #poster-track {
        width: min(20rem, 70vw);
        height: 6px;
        overflow: hidden;
        border-radius: 3px;
        background: rgb(255 255 255 / 0.25);
      }
      #poster-bar {
        width: 100%;
        height: 100%;
        background: #ffd54a;
        transform: scaleX(0.03);
        transform-origin: left;
      }
      #hints,
      #notice {
        position: fixed;
        left: 50%;
        z-index: 7;
        max-width: min(32rem, calc(100% - 2rem));
        margin: 0;
        padding: 0.5rem 0.875rem;
        border-radius: 8px;
        background: rgb(0 0 0 / 0.7);
        color: #fff;
        font: 15px/1.4 system-ui, sans-serif;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transform: translateX(-50%);
      }
      /* The hints live in the bottom dock, above the attribution row, so they never cover it. */
      #hints {
        position: static;
        z-index: auto;
        margin-bottom: 0.5rem;
        transform: none;
      }
      #notice {
        top: max(1rem, env(safe-area-inset-top));
      }
      #hints[data-visible="true"],
      #notice[data-visible="true"] {
        opacity: 1;
      }
      @media (prefers-reduced-motion: no-preference) {
        #poster {
          transition: opacity 0.4s;
        }
        #poster[data-state="done"] {
          opacity: 0;
        }
        #poster-bar {
          transition: transform 0.3s;
        }
        #hints,
        #notice {
          transition: opacity 0.3s;
        }
      }
      #dock {
        position: fixed;
        inset: auto 0 0;
        z-index: 6;
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: none;
      }
      /* As tall as the corner of the touch camera button, so the hints stay above it too. */
      #dock-row {
        display: flex;
        align-items: flex-end;
        align-self: stretch;
        min-height: calc(max(1rem, env(safe-area-inset-bottom)) + 56px);
      }
      #attribution {
        /* Leaves the corner of the touch camera button (56 px + 1 rem margin) free. */
        max-width: calc(100% - 1rem - 56px - 1.75rem);
        margin: 0 0 max(0.5rem, env(safe-area-inset-bottom)) max(0.5rem, env(safe-area-inset-left));
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
        background: rgb(0 0 0 / 0.65);
        color: #fff;
        font: 12px/1.4 system-ui, sans-serif;
        /* Touches on the text reach the canvas (joystick, look); only the button is live. */
        pointer-events: none;
      }
      #attribution button {
        min-height: 24px;
        margin: 0 0 0 0.25rem;
        padding: 0 0.25rem;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        font-weight: 600;
        text-decoration: underline;
        cursor: pointer;
        pointer-events: auto;
      }
      #attribution button:focus-visible,
      dialog#credits button:focus-visible {
        outline: 2px solid #ffd54a;
        outline-offset: 2px;
      }
      dialog#credits {
        width: min(40rem, calc(100% - 2rem));
        max-height: calc(100% - 2rem);
        padding: 1rem 1.25rem;
        border: 1px solid rgb(255 255 255 / 0.4);
        border-radius: 8px;
        background: #10202f;
        color: #fff;
        font: 0.9375rem/1.5 system-ui, sans-serif;
      }
      dialog#credits::backdrop {
        background: rgb(0 0 0 / 0.6);
      }
      dialog#credits h2 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      dialog#credits h3 {
        margin: 1rem 0 0.25rem;
        font-size: 1rem;
      }
      dialog#credits ul {
        margin: 0;
        padding-left: 1.25rem;
      }
      dialog#credits li {
        margin: 0.25rem 0;
      }
      dialog#credits a {
        color: #9ecbff;
      }
      dialog#credits .credits-body {
        max-height: 60vh;
        overflow: auto;
      }
      dialog#credits .credits-close {
        margin-top: 0.75rem;
        min-height: 2.5rem;
        padding: 0 1rem;
        border: 1px solid #fff;
        border-radius: 4px;
        background: transparent;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="{{canvasLabel}}"></canvas>
    <div id="poster" aria-hidden="true">
      <h1>{{posterTitle}}</h1>
      <p id="poster-message">{{loadingRoute}}</p>
      <div id="poster-track"><div id="poster-bar"></div></div>
    </div>
    <div id="fatal"></div>
    <div id="notice" role="status" aria-live="polite"></div>
    <div id="status" class="visually-hidden" role="status" aria-live="polite"></div>
    <div id="dock">
      <div id="hints" role="status" aria-live="polite"></div>
      <div id="dock-row">
        <footer id="attribution">
          {{attributionLine}}
          <button type="button" id="credits-open">{{creditsButton}}</button>
        </footer>
      </div>
    </div>
    <noscript>
      <style>
        #poster {
          display: none;
        }
      </style>
      <p style="color: #fff; font-family: system-ui, sans-serif; padding: 2rem">{{noscript}}</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
