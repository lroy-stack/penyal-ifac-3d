<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Walk test (dev)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1a2a;
      }
      #scene {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #hud {
        position: fixed;
        top: 0.75rem;
        left: 0.75rem;
        max-width: min(28rem, calc(100% - 1.5rem));
        margin: 0;
        padding: 0.5rem 0.75rem;
        color: #fff;
        background: rgb(0 0 0 / 0.65);
        border-radius: 0.5rem;
        font: 0.75rem/1.4 ui-monospace, monospace;
        pointer-events: none;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="Walk test scene"></canvas>
    <pre id="hud" aria-live="off"></pre>
    <script type="module" src="/dev/walk-test.ts"></script>
  </body>
</html>
