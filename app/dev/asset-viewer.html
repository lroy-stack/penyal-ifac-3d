<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asset viewer (dev)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1a2a;
      }
      #scene {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #stats {
        position: fixed;
        top: 0.75rem;
        left: 0.75rem;
        max-width: min(32rem, calc(100% - 1.5rem));
        padding: 0.75rem 1rem;
        color: #fff;
        background: rgb(0 0 0 / 0.7);
        border-radius: 0.5rem;
        font: 0.875rem/1.4 ui-monospace, monospace;
      }
      #stats h1 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
      }
      #stats dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.125rem 0.75rem;
        margin: 0;
      }
      #stats dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      #stats [data-error="true"] {
        color: #ffb4b4;
      }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="Asset preview"></canvas>
    <aside id="stats" aria-label="Asset statistics" aria-live="polite">
      <h1>Asset viewer</h1>
      <dl id="stats-list"></dl>
    </aside>
    <script type="module" src="/dev/asset-viewer.ts"></script>
  </body>
</html>
